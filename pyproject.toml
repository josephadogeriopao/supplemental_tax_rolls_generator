[project]
name = "supplemental-tax-rolls-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "josephadogeriopao", email = "joseph.adogeri@orleansassessors.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "dotenv>=0.9.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pillow>=12.3.0",
